name: Production build

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  frontend-tests:
    runs-on: ubuntu-latest
    container:
      image: node:24-bookworm-slim@sha256:0e0ff40c39bc087845bfb27465a0df4ea419520094bc35842ff83dd8cbe6f9b6
    defaults:
      run:
        working-directory: frontend/admin
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - run: npm ci
      - run: npm test
      - run: npm run test:production
      - name: Build with deliberately hostile inherited settings
        run: npm run build:production
        env:
          VITE_TEST_LOCAL_ADAPTER: "true"
          VITE_API_MODE: local
          VITE_MAP_FIXTURE: osm
          VITE_API_BASE_URL: http://localhost:5000

  backend-tests:
    runs-on: ubuntu-latest
    container:
      image: python:3.12-slim-bookworm@sha256:54c85f3c47607a77f32adec749d3c81d1348bf25833671f512b26a9b6d778cb3
    env:
      SUPABASE_DATABASE_URL: sqlite://
      SECRET_KEY: ci-only-test-session-key
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - run: python -m pip install --require-hashes -r deploy/test-requirements.lock
      - run: python -m pytest -q

  container-release:
    needs: [frontend-tests, backend-tests]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Build clean commit and save images
        run: ./scripts/build-production.sh "$GITHUB_SHA"
      - name: Check the saved release in disposable containers
        run: ./scripts/smoke-production.sh "dist/releases/$GITHUB_SHA"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: admin-release-${{ github.sha }}
          path: dist/releases/${{ github.sha }}/
          retention-days: 7
          compression-level: 0
          if-no-files-found: error
