services:
  admin-api:
    image: ${ADMIN_API_IMAGE:?Load images.tar.gz and use the release.env from the build}
    pull_policy: never
    env_file:
      - ${ADMIN_RUNTIME_ENV:?Set an absolute path to a protected backend env file}
    environment:
      SUPABASE_DATABASE_URL: ${SUPABASE_DATABASE_URL:?Backend database URL is required}
      SECRET_KEY: ${SECRET_KEY:?A production session secret is required}
      # One proxy in front: admin-web's Nginx. Set here rather than in the env
      # file because it describes this compose topology, not the deployment's
      # secrets, and because admin-api publishes no ports - it is reachable
      # only through that Nginx, which is what makes its X-Forwarded-For
      # trustworthy. See the proxy block in app/services/database.py.
      TRUSTED_PROXY_COUNT: "${TRUSTED_PROXY_COUNT:-1}"
      BACKUP_DIR: /srv/backups
    volumes:
      - admin-backups:/srv/backups
    restart: unless-stopped
    healthcheck:
      # curl ships in the image; avoids starting a Python interpreter per probe.
      test: ["CMD", "curl", "--fail", "--silent", "--max-time", "4", "--output", "/dev/null", "http://127.0.0.1:5000/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
      start_interval: 2s

  admin-web:
    image: ${ADMIN_WEB_IMAGE:?Load images.tar.gz and use the release.env from the build}
    pull_policy: never
    ports:
      - "127.0.0.1:${ADMIN_HTTP_PORT:-8080}:8080"
    depends_on:
      admin-api:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
      start_interval: 2s

networks:
  default:
    name: ${COMPOSE_PROJECT_NAME:-isu-camp-admin}_network

volumes:
  admin-backups:
    external: true
    name: ${ADMIN_BACKUP_VOLUME_NAME:-kumpas-admin-backups}
